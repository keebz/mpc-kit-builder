name: Build macOS app

# Builds the unsigned .app on GitHub's macOS runners and attaches it to the release.
# Runs when a release is published, or by hand (Actions > Build macOS app > Run workflow) for an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the build to (e.g. v0.1.2)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest        # Apple Silicon
            arch: arm64
          - runner: macos-15-intel      # Intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m pip install -r requirements-dev.txt
          QT_QPA_PLATFORM=offscreen python -m pytest -q

      - name: Build app
        run: ./build_app.sh

      - name: Smoke test (app starts and stays up)
        run: |
          QT_QPA_PLATFORM=offscreen "dist/MPC2000XL Kit Builder.app/Contents/MacOS/MPC2000XL Kit Builder" &
          pid=$!
          sleep 8
          kill -0 $pid && echo "app is running" && kill $pid

      - name: Zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/MPC2000XL Kit Builder.app" "MPC-Kit-Builder-${TAG}-macOS-${{ matrix.arch }}.zip"

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "MPC-Kit-Builder-${TAG}-macOS-${{ matrix.arch }}.zip" --clobber --repo "$GITHUB_REPOSITORY"
